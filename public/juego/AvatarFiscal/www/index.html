<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <title>AvatarFiscal</title>
    </head>
    <body style="background-color: black">
        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
        <script type="text/javascript">
            // Parche Fiscal Final
            (function() {
                // 1. Textos Personalizados
                TextManager.commandNewGame = function() { return "INICIAR AUDITORÍA"; };
                
                // 2. Saltar Título
                var _Scene_Boot_start = Scene_Boot.prototype.start;
                Scene_Boot.prototype.start = function() {
                    _Scene_Boot_start.call(this);
                    DataManager.setupNewGame();
                    SceneManager.goto(Scene_Map);
                };

                // 3. Listener para control de audio desde el padre (Next.js)
                var savedMasterVolume = 1;
                window.addEventListener('message', function(event) {
                    if (event.data && event.data.type === 'TOGGLE_AUDIO') {
                        if (typeof AudioManager !== 'undefined') {
                            if (event.data.muted) {
                                // Guardar volumen actual y silenciar
                                savedMasterVolume = AudioManager.masterVolume;
                                AudioManager.masterVolume = 0;
                                // También detener BGM actual
                                if (AudioManager._bgmBuffer) {
                                    AudioManager._bgmBuffer.stop();
                                }
                                if (AudioManager._bgsBuffer) {
                                    AudioManager._bgsBuffer.stop();
                                }
                            } else {
                                // Restaurar volumen
                                AudioManager.masterVolume = savedMasterVolume || 1;
                                // Reanudar BGM si había uno
                                if (AudioManager._currentBgm) {
                                    AudioManager.playBgm(AudioManager._currentBgm);
                                }
                            }
                        }
                    }
                });

                // 4. Iniciar con audio silenciado por defecto
                var _AudioManager_playBgm = null;
                var _audioInitialized = false;
                document.addEventListener('DOMContentLoaded', function() {
                    var checkAudio = setInterval(function() {
                        if (typeof AudioManager !== 'undefined' && !_audioInitialized) {
                            _audioInitialized = true;
                            AudioManager.masterVolume = 0;
                            clearInterval(checkAudio);
                        }
                    }, 100);
                });
            })();
        </script>
    </body>
</html>
